# File generated by the GradleUtils `setupGitHubActionsWorkflows` task, avoid modifying it directly
# The template can be found at https://github.com/neoforged/GradleUtils/blob/44d9e09cfa2c6032b84ac40495ea5ab7d64fe521/src/actionsTemplate/resources/.github/workflows/release.yml

name: Release

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  statuses: write

jobs:
  release:
    uses: neoforged/actions/.github/workflows/gradle-publish.yml@df695e4b2b67ab27e871db8180199119d5f4bbd2
    with:
      java: 21
      pre_gradle_tasks: build
      gradle_tasks: publish 
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      KTT_MAVEN_USERNAME: ${{ secrets.KTT_MAVEN_USERNAME }}
      KTT_MAVEN_TOKEN: ${{ secrets.KTT_MAVEN_TOKEN }}
